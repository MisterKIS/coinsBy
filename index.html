<!DOCTYPE html>
<html>
<body>
  <h1>Тест CORS</h1>
  <div id="result">Нажмите кнопку</div>
  <button onclick="test()">Тестировать</button>
  
  <script>
    async function test() {
      const url = 'https://script.google.com/macros/s/AKfycbzEiDV3pWTTlAhxOMxmLF055Mvg7x9jsEScU1CFSwA/dev?type=test';
      
      try {
        const response = await fetch(url);
        const text = await response.text();
        document.getElementById('result').innerHTML = 
          '<pre>' + text + '</pre>';
      } catch (error) {
        document.getElementById('result').innerHTML = 
          'ОШИБКА: ' + error.message;
      }
    }
  </script>
</body>
</html>
